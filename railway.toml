# Railway builds from the repo root by default.
# This Dockerfile lives at the root and copies job-ingestion/ into the image.
# Alternative: set Settings → Root Directory to job-ingestion and use job-ingestion/railway.toml instead.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Streamlit exposes /_stcore/health (not /health). Wrong path => 502 on the public URL.
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
