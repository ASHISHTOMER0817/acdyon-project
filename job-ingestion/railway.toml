# Railway service config when Root Directory = job-ingestion
# Streamlit: default CMD (start.sh). Flask: override Start Command to: sh flask_start.sh

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Streamlit default. For Flask service use healthcheckPath = "/health" in the dashboard.
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
