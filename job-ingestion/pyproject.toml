[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-ingestion"
version = "0.1.0"
description = "Resilient job-listing ingestion: Firecrawl, Selenium fallback, Gemini extraction, in-memory demo store."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Acdyon frontend challenge candidate" }]
dependencies = [
  "flask>=3.0.0",
  "flask-cors>=4.0.0",
  "streamlit>=1.32.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "httpx>=0.27.0",
  "google-genai>=1.0.0",
  "google-generativeai>=0.8.0",
  "firecrawl-py>=1.2.0",
  "selenium>=4.20.0",
  "webdriver-manager>=4.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
